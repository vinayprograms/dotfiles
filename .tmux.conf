# ---------- Basic customizations ----------
set -g default-command "/opt/homebrew/bin/bash --login"
set -g default-terminal "xterm-256color-italic"
set-option -ga terminal-overrides ',*:enacs@:smacs@:rmacs@:acsc@'
set-option -as terminal-overrides ',xterm*:sitm=\E[3m'
set-option -as terminal-overrides ',xterm*:smxx=\E[9m'
set-option -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Pane and window highlighting
set -g pane-border-lines double
set -g pane-border-style 'fg=#006400,bg=default'
set -g pane-active-border-style 'fg=#006400,bg=#050505'
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[bg=default]#[fg=1],#[fg=default]}╼ #{pane_current_command} ╾#[bg=default]#[fg=default]'
set -g window-status-current-style fg=orange,bold
set -g window-status-current-format "#[bold][#I:#W]"
set -g window-active-style 'fg=default,bg=#020202'

# Allow iTerm2 escape codes to pass through
set -g allow-passthrough on

# renumber windows when one is closed
set-option -g renumber-windows on

# Tmux has a bug and is treating LF(\n) like CRLF(\r\n).
# SOURCE: https://github.com/tmux/issues/224
set -ag terminal-overrides ',*:cud1=\E[1B'

set -g status-position top
set -g status-style "fg=#665c54,bg=default"
set -g status-interval 1
set -g status-right-length 120
set -s escape-time 100
set -g status-right "#(pomo)   #(batt) 👤 #(whoami) 💻 #(hostname)      %a %b %-e %Y, %-l:%M%P %Z"

set -g base-index 1 # Start tmux window and pane indexes from '1'

set -g mouse on

set-option -g automatic-rename off # "<prefix> ," to rename a window
set-option -g allow-rename off # "<prefix> ," to rename a window
set-option -g automatic-rename off

# ---------- notifications ----------
# monitor-activity must stay OFF: it flags a window on its first output, and a
# running Claude prints its spinner every second. The silence-based flag below
# ("Claude attention flag") is what marks finished / waiting windows.
set -g monitor-activity off
set -g visual-activity off

set -g monitor-bell on
set -g visual-bell off
set -g window-status-bell-style "bg=red,fg=white,bold"

# ---------- aliases ----------
set -s command-alias[100] mv="rename-window"
set -s command-alias[101] cp="copy-mode"
set -s command-alias[102] ls="list-sessions"

# ---------- REMAPS ----------
# Set prefix to Esc-Space
unbind C-b
set-option -g prefix M-Space
bind M-Space send-prefix

# Use vi keybindings for tmux
set -g status-keys vi
setw -g mode-keys vi

# Try to replicate vim customizations
bind v copy-mode          # like Vim visual mode
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind P paste-buffer       # like Vim paste

bind -r g display-popup -E "$SHELL --init-file $HOME/.bash_profile" #new-session -A -s scratch"

bind c new-window -c "#{pane_current_path}"

# Split panes with '\' and '-'
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
unbind %

# Use vim style keybindings to resize panes
setw -g xterm-keys on
bind -n M-Left resize-pane -L 1
bind -n M-Down resize-pane -D 1
bind -n M-Up resize-pane -U 1
bind -n M-Right resize-pane -R 1

# Use vim keybindings for moving between panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
set-option -g repeat-time 0 # Don't repeat <prefix>+<navigation key>


# Reload configuration
bind -r r source-file ~/.tmux.conf

# Rename current window (prompts for a new name, pre-filled with current)
bind R command-prompt -I "#W" "rename-window '%%'"

