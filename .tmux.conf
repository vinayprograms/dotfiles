# ---------- Claude attention flag ----------
# A Claude turn in progress redraws its spinner every second; an idle prompt,
# a permission dialog, or a finished turn produces no output at all. So a
# window that has been silent for 10s means "done / needs a human". tmux flags
# such windows (current window excluded) and the flag clears when you visit it.
#   red    = new output since you last looked (fresh completion / prompt)
#   yellow = you visited and left without doing anything; nothing new since
set -g monitor-silence 10
set -g silence-action other
set -g visual-silence on                  # status msg instead of a terminal beep
set -g window-status-activity-style "fg=white,bg=red,bold"
# On every window switch, stamp the window you just left ("!") with its
# last-output time. window_activity only changes when the pane prints.
set-hook -g session-window-changed 'setw -F -t "!" @seen "#{window_activity}"'
set -g window-status-format "#{?window_silence_flag,#{?#{==:#{window_activity},#{@seen}},#[fg=white#,bg=purple#,bold],#[fg=white#,bg=red#,bold]},}[#I:#W]"
# Per-window opt-out (e.g. a plain shell): setw monitor-silence 0
